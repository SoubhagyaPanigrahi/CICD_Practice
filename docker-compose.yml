services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    volumes:
      - ./app:/app

    environment:
      - FLASK_ENV=development

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
